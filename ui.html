<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ffffff; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .title {
    font-size: 14px;
    font-weight: 400;
    line-height: 17px;
    color: #A2A2A2;
  }
  .row {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .cell {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .cell.arrow { cursor: pointer; }
  .cell.arrow svg {
    transition: transform 0.35s ease;
    transform-origin: 50% 50%;
  }
  .cell.arrow.flipped svg { transform: rotate(180deg) translateY(-4px); }
  button {
    width: 100%;
    height: 40px;
    background: #000000;
    color: #ffffff;
    border: none;
    border-radius: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #333333; }
  button:disabled { background: #A2A2A2; cursor: default; }
  #log {
    padding: 10px;
    background: #f5f5f5;
    border-radius: 11px;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  #log.error {
    color: #D7373F;
    background: #FFF5F5;
  }
</style>
</head>
<body>
  <div class="title">Select a section or frame</div>

    </div>
  </div>

  <button id="run">Switch</button>
  <div id="log"></div>

<script>
  const btn = document.getElementById('run');
  const log = document.getElementById('log');
  const arrowCell = document.getElementById('arrowCell');

  // false: Android → iOS; true: iOS → Android
  let reverse = false;

  arrowCell.onclick = () => {
    reverse = !reverse;
    arrowCell.classList.toggle('flipped', reverse);
  };

  btn.onclick = () => {
    btn.disabled = true;
    parent.postMessage({ pluginMessage: { type: 'run', reverse } }, '*');
  };

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg || (msg.type !== 'done' && msg.type !== 'error')) return;
    btn.disabled = false;

    log.classList.remove('error');

    if (msg.type === 'error') {
      const lines = [
        'Cannot switch: some components reference a broken library or deleted components.',
        'Fix the library connection first, then try again.',
        '',
      ];
      msg.names.forEach((n) => lines.push('• ' + n));
      if (msg.total > msg.names.length) {
        lines.push(`…and ${msg.total - msg.names.length} more`);
      }
      log.classList.add('error');
      log.style.display = 'block';
      log.textContent = lines.join('\n');
      return;
    }

    const r = msg.report;
    const lines = [];
    if (msg.empty) {
      const from = reverse ? 'iOS' : 'Android';
      lines.push(`Select a frame or section with components where Platform = ${from}.`);
    } else {
      lines.push('✅ Switched');
      lines.push(`Root instances: ${r.switched}`);
      lines.push(`Nested components: ${r.nestedSwitched}`);
    }
    log.style.display = 'block';
    log.textContent = lines.join('\n');
  };
</script>

</html>
